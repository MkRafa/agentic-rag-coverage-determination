name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m corpus.generate
      - name: Deterministic tests
        run: pytest -q
      - name: Every eval label checks out against the corpus
        run: cda evals validate
      - name: No safety regression vs the committed baseline (stub, no API key)
        run: cda eval --stub --diff
