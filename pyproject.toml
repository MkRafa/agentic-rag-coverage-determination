[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-determination-agent"
version = "0.1.0"
description = "Agentic RAG for payer coverage determination — deterministic harness, MCP retrieval boundary, verified citations, two-layer evals."
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=0.120",
    "mcp>=2.0",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Remote vector backend. Not required — the default backend is in-process.
pinecone = ["pinecone>=7"]
# Test runner. The async tests need pytest-asyncio; without it they fail
# rather than skip.
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cda = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "policy_corpus*", "evals*", "corpus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
